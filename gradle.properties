org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Android settings
android.useAndroidX=true
android.nonTransitiveRClass=true

# Bump this once per release. :mobile derives its versionCode from it directly; :wear pins a
# literal versionCode at releaseNumber + 1000 instead (F-Droid's updater needs a parseable
# literal, see wear/build.gradle.kts), and release.yml verifies the tie on tag push.
releaseNumber=4
