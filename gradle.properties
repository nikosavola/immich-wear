org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Android settings
android.useAndroidX=true
android.nonTransitiveRClass=true

# Bump this once per release. :wear and :mobile each derive their own Play Store versionCode from
# it with a different offset (see their build.gradle.kts), since Play requires a watch APK's
# versionCode to be unique across form factors within the same listing.
releaseNumber=1
